[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kyuura-engine"
version = "0.164.0"
description = "旧裏ポケモンカードゲームの対戦エンジン（公式ルール 2000.02.14版）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# 実行時のパッケージ（kyuura_engine と、__init__.py のあるサブパッケージ。resolution など）を探して入れる。tests・scripts・tools・examples は入れない
[tool.setuptools.packages.find]
include = ["kyuura_engine", "kyuura_engine.*"]
namespaces = false

[tool.setuptools.package-data]
kyuura_engine = ["data/*.json"]

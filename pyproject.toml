[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kyuura-engine"
version = "0.101.0"
description = "旧裏ポケモンカードゲームの対戦エンジン（公式ルール 2000.02.14版）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["kyuura_engine"]

[tool.setuptools.package-data]
kyuura_engine = ["data/*.json"]
